
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Aggregator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #14213d;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
            color: #dce4f2;
        }

        nav {
            background: #ffffff;
            padding: 15px 8%;
            box-shadow: 0 2px 5px #00000010;
        }

        nav a {
            color: #14213d;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        main {
            padding: 40px 8%;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000010;
        }

        .welcome h2 {
            color: #14213d;
            margin-bottom: 12px;
        }

        .welcome p {
            line-height: 1.6;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>NEWS HUB</h1>
        <p>Your Daily Source of Latest News</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="#">Technology</a>
        <a href="#">Sports</a>
        <a href="#">Business</a>
        <a href="#">Entertainment</a>
    </nav>

    <main>
        <section class="welcome">
            <h2>Welcome to News Hub</h2>
            <p>
                Stay informed with the latest news from around the world.
                Explore technology, sports, business, entertainment and more.
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 News Hub | Built with Python and Flask</p>
    </footer>

</body>
</html>
